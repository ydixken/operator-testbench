name: Docs

# Builds the mkdocs site and deploys it to GitHub Pages through the Pages API
# (actions/deploy-pages), so no gh-pages branch exists. Requires the repo's
# Pages source set to "GitHub Actions" (one-time setting).

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build the site
        # Same pin as ci.yml; --strict turns warnings into errors.
        run: |
          pip install mkdocs-material==9.7.7
          mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
