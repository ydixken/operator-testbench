name: Release

# A version tag is the release. Go modules are consumed by tag, so the only
# artifact is the GitHub release with notes generated from the merged pull
# requests. A tag with a hyphen is a SemVer prerelease and is marked as one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    # A hung API call would otherwise hold the job for the 6 h default.
    timeout-minutes: 15
    permissions:
      contents: write  # the workflow default is read-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
