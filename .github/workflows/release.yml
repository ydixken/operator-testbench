name: Release

# A version tag is the release: the GitHub release with notes generated from
# the merged pull requests, the testbench image under the same tag, and the
# chart with version <tag without v> and appVersion <tag>. A tag with a hyphen
# is a SemVer prerelease and is marked as one. The image has no latest tag,
# because it fits only the operator versions its packs pin.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    # A hung API call would otherwise hold the job for the 6 h default.
    timeout-minutes: 15
    permissions:
      contents: write  # the workflow default is read-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile cross-compiles, so no QEMU is needed for arm64.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Package and push the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/operator-testbench --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          helm push "operator-testbench-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
