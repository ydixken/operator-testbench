{{- $rules := (get (.Values.packs | default dict) .Values.pack | default dict).rules }}
{{- if not $rules }}{{ fail (printf "packs.%s.rules is required: the scenario role of the pack" .Values.pack) }}{{ end }}
{{- $operatorNS := required "operator.namespace is required: the namespace the installed operator runs in" .Values.operator.namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "testbench.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testbench.labels" . | nindent 4 }}
---
# Bound only by RoleBindings in the scenario namespaces, so it grants nothing
# anywhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "testbench.fullname" . }}-scenario
  labels:
    {{- include "testbench.labels" . | nindent 4 }}
rules:
  # What the engine needs in every scenario namespace: read the namespace
  # itself, find and clear leftovers, exec into pods, and report events.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  {{- toYaml $rules | nindent 2 }}
{{- range include "testbench.namespaces" . | fromYamlArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "testbench.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "testbench.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "testbench.fullname" $ }}-scenario
subjects:
  - kind: ServiceAccount
    name: {{ include "testbench.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# The version check and the controller log tail read the operator's pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "testbench.fullname" . }}-operator
  namespace: {{ $operatorNS }}
  labels:
    {{- include "testbench.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "testbench.fullname" . }}-operator
  namespace: {{ $operatorNS }}
  labels:
    {{- include "testbench.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "testbench.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "testbench.fullname" . }}
    namespace: {{ .Release.Namespace }}
