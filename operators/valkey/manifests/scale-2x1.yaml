# Scale-shards start and end state. Identical to scale-3x1.yaml except
# spec.shards, so a re-apply under the same field owner changes nothing else.
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: scale
spec:
  shards: 2
  replicas: 1
  image: valkey/valkey:9.0.0
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  exporter:
    image: oliver006/redis_exporter:v1.88.0
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
