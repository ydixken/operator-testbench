# Smoke: a 3x1 ValkeyCluster converges, every owned object has the shape the
# operator promises at v0.7.1, the cluster answers CLUSTER INFO, and deleting
# the CR garbage-collects everything it owns. Readiness follows upstream's own
# e2e (test/e2e/valkeycluster_test.go at v0.7.1): state, reason, the shard
# counters, four conditions, no Degraded, and observedGeneration ==
# metadata.generation so a Ready left over from an earlier generation cannot
# pass. Pod Ready alone means nothing here: the readiness probe only PINGs.
apiVersion: testbench.dev/v1alpha1
kind: Scenario
labels: [smoke]
priority: 1
steps:
  - name: apply a 3x1 cluster
    timeout: 1m
    apply: {file: manifests/cluster-3x1.yaml}

  - name: the cluster reports Ready for the applied generation
    timeout: 10m
    assert:
      object: {apiVersion: valkey.io/v1alpha1, kind: ValkeyCluster, name: demo}
      match:
        status: {state: Ready, reason: ClusterHealthy, shards: 3, readyShards: 3}
      cel:
        - >-
          self.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True'
          && c.reason == 'ClusterHealthy' && c.observedGeneration == self.metadata.generation)
        - >-
          self.status.conditions.exists(c, c.type == 'Progressing' && c.status == 'False'
          && c.reason == 'ReconcileComplete' && c.observedGeneration == self.metadata.generation)
        - >-
          self.status.conditions.exists(c, c.type == 'ClusterFormed' && c.status == 'True'
          && c.observedGeneration == self.metadata.generation)
        - >-
          self.status.conditions.exists(c, c.type == 'SlotsAssigned' && c.status == 'True'
          && c.observedGeneration == self.metadata.generation)
        - self.status.conditions.filter(c, c.type == 'Degraded' && c.status == 'True').size() == 0

  - name: six ValkeyNodes are ready, with exactly one primary per shard
    timeout: 3m
    assert:
      list: {apiVersion: valkey.io/v1alpha1, kind: ValkeyNode, selector: valkey.io/cluster=demo}
      count: 6
      cel:
        - items.all(n, has(n.status.ready) && n.status.ready)
        - items.all(n, has(n.status.role) && n.status.role in ['primary', 'replica'])
        - >-
          items.all(n, items.filter(m, m.metadata.labels['valkey.io/shard-index'] == n.metadata.labels['valkey.io/shard-index']
          && has(m.status.role) && m.status.role == 'primary').size() == 1)

  - name: six pods are Ready and run the server and metrics-exporter containers
    timeout: 2m
    assert:
      list: {apiVersion: v1, kind: Pod, selector: valkey.io/cluster=demo}
      count: 6
      cel:
        - items.all(p, p.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True'))
        - >-
          items.all(p, p.spec.containers.size() == 2 && p.spec.containers.exists(c, c.name == 'server')
          && p.spec.containers.exists(c, c.name == 'metrics-exporter'))

  - name: the headless Service exposes 6379 to the cluster's pods
    timeout: 1m
    assert:
      object: {apiVersion: v1, kind: Service, name: valkey-demo}
      match:
        spec:
          type: ClusterIP
          clusterIP: None
          selector: {valkey.io/cluster: demo}
          ports:
            - {name: valkey, port: 6379, protocol: TCP}

  - name: the ConfigMap carries valkey.conf and both probe scripts
    timeout: 1m
    assert:
      object: {apiVersion: v1, kind: ConfigMap, name: valkey-demo}
      cel:
        - "['valkey.conf', 'readiness-check.sh', 'liveness-check.sh'].all(k, k in self.data)"

  - name: the operator provisioned the three system passwords
    timeout: 1m
    assert:
      object: {apiVersion: v1, kind: Secret, name: internal-demo-system-passwords}
      cel:
        - "['_operator', '_exporter', '_replication'].all(k, k in self.data)"

  - name: the ACL Secret has the operator's Secret type and the aclfile
    timeout: 1m
    assert:
      object: {apiVersion: v1, kind: Secret, name: internal-demo-acl}
      match: {type: valkey.io/acl}
      cel:
        - "'users.acl' in self.data"

  - name: one PodDisruptionBudget allows a single unavailable pod
    timeout: 1m
    assert:
      object: {apiVersion: policy/v1, kind: PodDisruptionBudget, name: valkey-demo}
      match:
        spec:
          maxUnavailable: 1
          selector: {matchLabels: {valkey.io/cluster: demo}}

  - name: valkey reports cluster_state:ok with six known nodes in three shards
    timeout: 2m
    exec:
      selector: valkey.io/cluster=demo
      container: server
      # The server container carries the _operator password in VALKEYCLI_AUTH
      # and valkey-cli would send it as the default user's AUTH; the default
      # user has no password here, so unset it first (upstream does the same).
      command: [sh, -c, 'unset VALKEYCLI_AUTH REDISCLI_AUTH; valkey-cli CLUSTER INFO']
      expect:
        contains: ['cluster_state:ok', 'cluster_known_nodes:6', 'cluster_size:3']

  - name: delete the cluster
    timeout: 3m
    delete:
      object: {apiVersion: valkey.io/v1alpha1, kind: ValkeyCluster, name: demo}

  - name: the Service is garbage-collected
    timeout: 2m
    assert:
      object: {apiVersion: v1, kind: Service, name: valkey-demo}
      absent: true

  - name: the ConfigMap is garbage-collected
    timeout: 2m
    assert:
      object: {apiVersion: v1, kind: ConfigMap, name: valkey-demo}
      absent: true

  - name: the system-passwords Secret is garbage-collected
    timeout: 2m
    assert:
      object: {apiVersion: v1, kind: Secret, name: internal-demo-system-passwords}
      absent: true

  - name: the ACL Secret is garbage-collected
    timeout: 2m
    assert:
      object: {apiVersion: v1, kind: Secret, name: internal-demo-acl}
      absent: true

  - name: the PodDisruptionBudget is garbage-collected
    timeout: 2m
    assert:
      object: {apiVersion: policy/v1, kind: PodDisruptionBudget, name: valkey-demo}
      absent: true

  - name: no ValkeyNode remains
    timeout: 2m
    assert:
      list: {apiVersion: valkey.io/v1alpha1, kind: ValkeyNode, selector: valkey.io/cluster=demo}
      count: 0

  - name: no StatefulSet remains
    timeout: 2m
    assert:
      list: {apiVersion: apps/v1, kind: StatefulSet, selector: valkey.io/cluster=demo}
      count: 0

  - name: no pod remains
    timeout: 3m
    assert:
      list: {apiVersion: v1, kind: Pod, selector: valkey.io/cluster=demo}
      count: 0
